# Where the agent looks every day. Everything here is free and meant to be
# read by programs (RSS feeds, sitemaps and the official Hacker News search API).
#
# kind = "primary"    -> the organisation announcing its own news
# kind = "press"      -> journalists reporting on it
# kind = "newsletter" -> individual analysts and curators
#
# general = true      -> the feed covers more than AI, so only items matching
#                        ai_keywords are kept
# type = "sitemap"    -> for sites with no RSS feed: new pages are found through
#                        the site's sitemap, limited to path_prefix
# type = "listing"    -> for a page with no feed that carries its own list of
#                        entries: only entries of the type named in `only` are kept

[settings]
max_age_days = 3        # ignore anything older than this
hn_min_points = 50      # Hacker News stories below this are ignored
# Hacker News stories and items from general feeds are kept only if they
# match one of these.
ai_keywords = [
    "ai", "a.i.", "llm", "llms", "gpt", "chatgpt", "openai", "anthropic", "claude",
    "gemini", "deepmind", "mistral", "llama", "nvidia", "hugging face", "huggingface",
    "copilot", "agent", "agents", "agentic", "transformer", "diffusion", "inference",
    "fine-tuning", "finetuning", "neural", "machine learning", "deep learning",
    "model", "models", "rag", "mcp", "xai", "grok", "deepseek", "qwen", "agi",
]
# More words that keep a Hacker News story or a general-feed item. They are kept apart from ai_keywords because
# step 4 treats every word of that list as too common to tell one story from another: a product's name must stay
# out of it, or two articles about that product would no longer be grouped by it. Step 3 alone reads this list.
# Added on 9 October 2026: without them, "I gave Opus 5.5 one prompt and six hours..." (274 points) was dropped.
also_keep = [
    "artificial intelligence", "generative", "chatbot", "chatbots", "deepfake", "deepfakes", "superintelligence",
    "voice clone", "voice cloning", "humanoid", "robotics", "vibe coding", "prompt injection", "open weights",
    "opus", "sonnet", "codex", "sora", "veo", "midjourney", "perplexity", "cursor", "elevenlabs", "suno",
    "ollama", "cohere", "groq", "cerebras", "notebooklm",
]

